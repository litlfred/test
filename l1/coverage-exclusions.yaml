# ignored when matching). `reason` is one of: background-fact, manufacturer-statement,
# duplicate-of:<recommendation key>, editorial, research-question.
#
# An exclusion counts toward 100% only once a person signs it off (SC-03.3): set `signedOffBy`
# and `signedOffAt`. Until then the coverage report lists it as "pending sign-off".
